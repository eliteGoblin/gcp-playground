# Example of an interruptible batch job on Spot nodes.
#
# How it reaches Spot nodes:
#   - toleration for the taint dedicated=batch:NoSchedule (set on the batch-spot node pool in Terraform)
#   - nodeSelector role=batch, so it never lands on the system pool
#   - the pool scales from 0: the cluster autoscaler adds a Spot node when this Pod is pending
#
# How it survives an interruption:
#   - Google reclaims a Spot node with a short notice (about 30 seconds). The Pod gets SIGTERM.
#   - the script traps SIGTERM, saves its position, and exits
#   - podFailurePolicy ignores Pods that fail because of a node disruption, so a
#     preemption does not count against backoffLimit. The Job starts a new Pod.
#   - work must be idempotent or checkpointed. This example checkpoints to an emptyDir
#     only to show the pattern; a real job writes the checkpoint to GCS or a database.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
  namespace: batch
spec:
  schedule: "0 16 * * *" # 03:00 Sydney time (AEDT)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      podFailurePolicy:
        rules:
          - action: Ignore
            onPodConditions:
              - type: DisruptionTarget
      template:
        metadata:
          labels:
            app: nightly-report
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 25
          nodeSelector:
            role: batch
          tolerations:
            - key: dedicated
              operator: Equal
              value: batch
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: report
              image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
              command:
                - /bin/sh
                - -c
                - |
                  step=$(cat /work/checkpoint 2>/dev/null || echo 0)
                  trap 'echo "SIGTERM at step $step: checkpoint saved"; echo "$step" > /work/checkpoint; exit 143' TERM
                  echo "node=$NODE_NAME start at step $step"
                  while [ "$step" -lt 30 ]; do
                    step=$((step + 1))
                    echo "step $step of 30"
                    sleep 2 & wait $!
                  done
                  echo "done"
              env:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              resources:
                requests: { cpu: 100m, memory: 32Mi }
                limits: { memory: 64Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir: {}
