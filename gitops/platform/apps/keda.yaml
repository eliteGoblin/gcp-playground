apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.21.1
    helm:
      valuesObject:
        nodeSelector:
          role: system
        # The operator reads Pub/Sub backlog from Cloud Monitoring. IAM role
        # roles/monitoring.viewer is granted to this Kubernetes service account in Terraform.
        serviceAccount:
          operator:
            name: keda-operator
        resources:
          operator:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: "1", memory: 512Mi }
          metricServer:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: "1", memory: 512Mi }
          webhooks:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
