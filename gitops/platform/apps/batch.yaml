apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: batch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/eliteGoblin/gcp-playground.git
    targetRevision: main
    path: gitops/platform/batch
  destination:
    server: https://kubernetes.default.svc
    namespace: batch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
