apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: orders-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: orders-worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-worker
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
