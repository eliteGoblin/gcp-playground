apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-api
spec:
  parentRefs:
    - name: external
      namespace: gateway
      sectionName: https
  hostnames:
    - orders.gke.frankbluemind.com
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: orders-api
          port: 80
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: orders-api
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        port: 8080
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: orders-api
---
# Attaches the Cloud Armor policy "demo-edge" (Terraform, edge.tf) to this backend.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: orders-api
spec:
  default:
    securityPolicy: demo-edge
  targetRef:
    group: ""
    kind: Service
    name: orders-api
