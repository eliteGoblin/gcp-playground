# App of apps: the only Application that is applied by hand.
# It points at gitops/platform/apps, which holds one Application per component.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/eliteGoblin/gcp-playground.git
    targetRevision: main
    path: gitops/platform/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
