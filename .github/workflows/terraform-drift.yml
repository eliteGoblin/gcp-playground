name: terraform-drift

# Daily drift detection: a plan with the read-only identity.
# Exit code 2 means the live infrastructure differs from the code.
# The workflow then opens (or updates) one GitHub issue with the label "drift".

on:
  schedule:
    - cron: "0 20 * * *" # 07:00 Sydney time (AEDT)
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform-demo
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ENV_DIR: terraform/envs/demo

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: terraform plan -detailed-exitcode
        id: plan
        run: |
          terraform -chdir="$ENV_DIR" init -backend-config=backend.hcl
          set +e
          terraform -chdir="$ENV_DIR" plan -lock=false -no-color -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          grep -E '^  # |^Plan:|^No changes|Error' plan.txt || true
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = no drift, 2 = drift, 1 = the plan itself failed
          if [ "$code" -eq 1 ]; then cat plan.txt; exit 1; fi
      - name: report drift
        if: steps.plan.outputs.exitcode == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Terraform found drift in \`$ENV_DIR\`. Run: $RUN_URL"
            echo
            echo '```'
            grep -E '^  # |^Plan:' plan.txt
            echo '```'
          } > body.md
          gh label create drift --color B60205 --description "Terraform drift" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label drift --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Terraform drift: demo" --label drift --body-file body.md
          fi
          echo "::warning::Drift detected"
