name: terraform

# Pull request: format, validate, lint, security scans, plan (read-only identity).
# Push to main: the same checks, then apply (apply identity, main branch only).
# terraform/bootstrap grants the pipeline its own permissions, so an administrator
# applies it by hand. The pipeline only validates it.

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - ".tflint.hcl"
      - ".trivyignore"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - ".tflint.hcl"
      - ".trivyignore"
  workflow_dispatch:

permissions: {}

# One Terraform run per environment at a time. A second run waits.
concurrency:
  group: terraform-demo
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.6"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ENV_DIR: terraform/envs/demo

jobs:
  static:
    name: fmt, validate, tflint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive -diff
      - name: terraform validate (each root, no backend)
        run: |
          for root in terraform/bootstrap terraform/envs/*; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  scan:
    name: security scan (trivy, checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to GitHub code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: trivy config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: config
          scan-ref: terraform
          trivyignores: .trivyignore
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true # without this, SARIF output ignores the severity filter
          format: sarif
          output: trivy-config.sarif
          exit-code: "1"
      - name: checkov
        if: always()
        run: |
          pipx install checkov==3.4.5
          checkov --directory terraform --config-file .checkov.yaml \
            --output cli --output sarif --output-file-path console,checkov.sarif
      - name: upload trivy results
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - name: upload checkov results
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: checkov.sarif
          category: checkov

  plan:
    name: plan
    # Pull requests from forks get no OIDC token, so they stop after the static checks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [static, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform plan
        run: |
          terraform -chdir="$ENV_DIR" init -backend-config=backend.hcl
          terraform -chdir="$ENV_DIR" plan -lock-timeout=5m -no-color -out=tfplan | tee plan.txt
      - name: plan summary
        if: always()
        run: |
          {
            echo '### Terraform plan (`'"$ENV_DIR"'`)'
            echo '```'
            grep -E '^  # |^Plan:|^No changes' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: apply
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [static, scan]
    runs-on: ubuntu-latest
    environment: demo # add required reviewers on this environment for a manual approval gate
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform plan
        run: |
          terraform -chdir="$ENV_DIR" init -backend-config=backend.hcl
          terraform -chdir="$ENV_DIR" plan -lock-timeout=5m -no-color -out=tfplan | tee plan.txt
      - name: stop when the plan deletes or replaces a resource
        # A destructive plan needs a human. Re-run with workflow_dispatch after review,
        # or apply by hand. The check reads the plan file, not the text output.
        if: github.event_name == 'push'
        run: |
          deletes=$(terraform -chdir="$ENV_DIR" show -json tfplan \
            | jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length')
          echo "Resources to delete or replace: $deletes"
          if [ "$deletes" -gt 0 ]; then
            terraform -chdir="$ENV_DIR" show -json tfplan \
              | jq -r '.resource_changes[] | select(.change.actions | index("delete")) | .address'
            echo "::error::The plan deletes or replaces $deletes resource(s). Apply stopped."
            exit 1
          fi
      - name: terraform apply
        run: terraform -chdir="$ENV_DIR" apply -lock-timeout=5m -no-color tfplan
